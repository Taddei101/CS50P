<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Teste</title>
    <style>
        /* Estilos simples apenas para organizar visualmente os campos */
        body { font-family: Arial, sans-serif; margin: 20px; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input { padding: 5px; width: 250px; display: block; margin-top: 5px; }
        input[readonly] { background-color: #f0f0f0; cursor: not-allowed; }
    </style>
</head>
<body>

    <label for="cep">CEP:</label>
    <input type="text" id="cep" placeholder="01001000" maxlength="9">

    <label for="rua">Rua:</label>
    <input type="text" id="rua" readonly>

    <label for="bairro">Bairro:</label>
    <input type="text" id="bairro" readonly>

    <label for="cidade">Cidade:</label>
    <input type="text" id="cidade" readonly>

    <label for="uf">Estado (UF):</label>
    <input type="text" id="uf" readonly>

    <script>
        const cepInput = document.getElementById('cep');
        
        cepInput.addEventListener('blur', () => {
            const cep = cepInput.value.replace(/\D/g, '');
            
            if (cep.length === 8) {
                fetch(`https://brasilapi.com.br/api/cep/v1/${cep}`)
                    .then(response => {
                        if (!response.ok) throw new Error('CEP não encontrado');
                        return response.json();
        })
        .then(dados => {
            document.getElementById('rua').value = dados.street;
            document.getElementById('bairro').value = dados.neighborhood;
            document.getElementById('cidade').value = dados.city;
            document.getElementById('uf').value = dados.state;
        })
        .catch(error => {
            console.error('Erro ao buscar o CEP:', error);
            alert('CEP não encontrado.');
            limparFormulario();
        });
}
        });

        function limparFormulario() {
            document.getElementById('rua').value = '';
            document.getElementById('bairro').value = '';
            document.getElementById('cidade').value = '';
            document.getElementById('uf').value = '';
        }
    </script>

</body>
</html>
